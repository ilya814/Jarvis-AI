<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>J.A.R.V.I.S — Your AI Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #050a12;
      --panel: #0a1628;
      --border: #0e2a4a;
      --accent: #00c8ff;
      --accent2: #0066ff;
      --glow: rgba(0,200,255,0.15);
      --text: #c8e0f0;
      --muted: #4a6a8a;
      --user-bg: #0d1e35;
      --ai-bg: #071520;
      --danger: #ff4060;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Animated grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,200,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,200,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Header */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(0,200,255,0.05) 0%, transparent 100%);
      flex-shrink: 0;
    }

    .logo {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 1.3rem;
      letter-spacing: 0.15em;
      color: var(--accent);
      text-shadow: 0 0 20px rgba(0,200,255,0.5);
    }

    .logo span { color: #fff; }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Settings bar */
    .settings-bar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .settings-bar label {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .settings-bar input, .settings-bar select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }

    .settings-bar input:focus, .settings-bar select:focus {
      border-color: var(--accent);
    }

    #api-key-input { width: 260px; letter-spacing: 0.04em; }

    .divider { width: 1px; height: 20px; background: var(--border); }

    /* Messages */
    #chat {
      position: relative;
      z-index: 5;
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg {
      max-width: 80%;
      padding: 14px 18px;
      border-radius: 6px;
      font-size: 0.88rem;
      line-height: 1.7;
      position: relative;
      animation: fadeUp 0.3s ease;
      white-space: pre-wrap;
      word-break: break-word;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user-bg);
      border: 1px solid var(--border);
      border-right: 2px solid var(--accent2);
    }

    .msg.ai {
      align-self: flex-start;
      background: var(--ai-bg);
      border: 1px solid var(--border);
      border-left: 2px solid var(--accent);
    }

    .msg .role {
      font-family: 'Orbitron', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .msg.ai .role { color: var(--accent); }
    .msg.user .role { color: var(--accent2); text-align: right; }

    .msg.error { border-left: 2px solid var(--danger); }
    .msg.error .role { color: var(--danger); }

    /* Typing indicator */
    .typing {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 14px 18px;
    }

    .typing span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    /* Input area */
    .input-area {
      position: relative;
      z-index: 10;
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    #user-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 4px;
      font-size: 0.88rem;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      resize: none;
      min-height: 46px;
      max-height: 160px;
      outline: none;
      transition: border-color 0.2s;
      line-height: 1.5;
    }

    #user-input:focus { border-color: var(--accent); }
    #user-input::placeholder { color: var(--muted); }

    .send-btn {
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border: none;
      color: #fff;
      padding: 12px 22px;
      border-radius: 4px;
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      white-space: nowrap;
      height: 46px;
    }

    .send-btn:hover { opacity: 0.85; }
    .send-btn:active { transform: scale(0.97); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Welcome */
    .welcome {
      text-align: center;
      margin: auto;
      padding: 40px;
    }

    .welcome .big {
      font-family: 'Orbitron', monospace;
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--accent);
      text-shadow: 0 0 40px rgba(0,200,255,0.4);
      margin-bottom: 10px;
    }

    .welcome .sub {
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      margin-bottom: 30px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .chip {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .chip:hover { border-color: var(--accent); color: var(--accent); }

    /* Code blocks */
    .msg code {
      background: rgba(0,200,255,0.07);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 0.85em;
      color: var(--accent);
    }

    .msg pre {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-left: 2px solid var(--accent);
      padding: 12px;
      border-radius: 4px;
      overflow-x: auto;
      margin: 8px 0;
    }

    .msg pre code {
      background: none;
      border: none;
      padding: 0;
    }

    /* Link preview banner */
    .link-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,200,255,0.06);
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.8rem;
      color: var(--accent);
      animation: fadeUp 0.3s ease;
      align-self: flex-start;
      max-width: 90%;
    }

    .link-banner .lb-icon { font-size: 1rem; flex-shrink: 0; }
    .link-banner .lb-text { flex: 1; overflow: hidden; }
    .link-banner .lb-url {
      font-family: 'Courier New', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      max-width: 400px;
    }
    .link-banner .lb-status { font-weight: 500; }

    .link-banner.fetching .lb-icon { animation: spin 1s linear infinite; }
    .link-banner.success { border-color: #00e676; color: #00e676; }
    .link-banner.failed  { border-color: var(--danger); color: var(--danger); }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      .msg { max-width: 95%; }
      #api-key-input { width: 180px; }
      .welcome .big { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">J.<span>A</span>.R.V.I.<span>S</span></div>
  <div class="status">
    <div class="status-dot"></div>
    <span id="status-text">Standby</span>
  </div>
</header>

<div class="settings-bar">
  <label for="api-key-input">API Key</label>
  <input type="password" id="api-key-input" placeholder="Paste your Groq API key here..." autocomplete="off"/>
  <div class="divider"></div>
  <label for="lang-select">Language</label>
  <select id="lang-select">
    <option value="English">English</option>
    <option value="French">French</option>
    <option value="Spanish">Spanish</option>
    <option value="German">German</option>
    <option value="Arabic">Arabic</option>
    <option value="Portuguese">Portuguese</option>
    <option value="Japanese">Japanese</option>
    <option value="Chinese">Chinese</option>
    <option value="Hindi">Hindi</option>
    <option value="Italian">Italian</option>
    <option value="Dutch">Dutch</option>
    <option value="Russian">Russian</option>
    <option value="Korean">Korean</option>
    <option value="Turkish">Turkish</option>
  </select>
  <div class="divider"></div>
  <label for="model-select">Model</label>
  <select id="model-select">
    <option value="llama-3.3-70b-versatile">Llama 3.3 70B (Best)</option>
    <option value="llama-3.1-8b-instant">Llama 3.1 8B (Fast)</option>
    <option value="mixtral-8x7b-32768">Mixtral 8x7B</option>
  </select>
</div>

<div id="chat">
  <div class="welcome" id="welcome">
    <div class="big">JARVIS</div>
    <div class="sub">Your AI assistant — type, code, browse, and more</div>
    <div class="chips">
      <div class="chip" onclick="quickSend('Write me a Python script to rename files in a folder')">🐍 Python script</div>
      <div class="chip" onclick="quickSend('Summarize this URL: https://en.wikipedia.org/wiki/Artificial_intelligence')">🔗 Summarize a link</div>
      <div class="chip" onclick="quickSend('Write a professional email to request a meeting')">✉️ Write an email</div>
      <div class="chip" onclick="quickSend('Explain quantum computing in simple terms')">⚛️ Explain something</div>
      <div class="chip" onclick="quickSend('Translate \"Hello, how are you?\" into French, Spanish, and Japanese')">🌍 Translate text</div>
      <div class="chip" onclick="quickSend('Debug this code: print(\"hello world\"')">🐛 Debug code</div>
    </div>
  </div>
</div>

<div class="input-area">
  <textarea id="user-input" placeholder="Ask JARVIS anything… or paste a link to analyze it" rows="1"></textarea>
  <button class="send-btn" id="send-btn" onclick="sendMessage()">SEND</button>
</div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const statusText = document.getElementById('status-text');
  const welcome = document.getElementById('welcome');

  let messages = [];

  // ── URL detection ──────────────────────────────────────────────
  function extractUrls(text) {
    const re = /https?:\/\/[^\s"'<>]+/g;
    return [...new Set(text.match(re) || [])];
  }

  // ── Fetch page content via allorigins proxy ────────────────────
  async function fetchPageContent(url) {
    const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
    const res = await fetch(proxy, { signal: AbortSignal.timeout(12000) });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (!json.contents) throw new Error('Empty response');

    // Strip HTML tags, collapse whitespace, limit length
    const text = json.contents
      .replace(/<style[\s\S]*?<\/style>/gi, '')
      .replace(/<script[\s\S]*?<\/script>/gi, '')
      .replace(/<[^>]+>/g, ' ')
      .replace(/\s{2,}/g, ' ')
      .trim()
      .slice(0, 6000);

    if (text.length < 30) throw new Error('No readable content found');
    return text;
  }

  // ── Link banner UI ─────────────────────────────────────────────
  function showLinkBanner(url, state, detail) {
    const id = 'lb-' + btoa(url).replace(/[^a-z0-9]/gi, '').slice(0, 12);
    let el = document.getElementById(id);

    const icons = { fetching: '⟳', success: '✔', failed: '✘' };
    const labels = { fetching: 'Reading link…', success: 'Link read', failed: 'Could not read link' };

    if (!el) {
      el = document.createElement('div');
      el.id = id;
      el.className = `link-banner ${state}`;
      el.innerHTML = `
        <div class="lb-icon">${icons[state]}</div>
        <div class="lb-text">
          <span class="lb-status">${labels[state]}</span>
          <span class="lb-url">${escHtml(url)}</span>
          ${detail ? `<span style="font-size:0.72rem;color:var(--muted)">${escHtml(detail)}</span>` : ''}
        </div>`;
      chat.appendChild(el);
    } else {
      el.className = `link-banner ${state}`;
      el.querySelector('.lb-icon').textContent = icons[state];
      el.querySelector('.lb-status').textContent = labels[state];
      if (detail) {
        let d = el.querySelector('.lb-detail');
        if (!d) { d = document.createElement('span'); d.className = 'lb-detail'; d.style.cssText = 'font-size:0.72rem;color:var(--muted)'; el.querySelector('.lb-text').appendChild(d); }
        d.textContent = detail;
      }
    }
    chat.scrollTop = chat.scrollHeight;
    return el;
  }

  // ── Auto-resize textarea ───────────────────────────────────────
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  function quickSend(text) { input.value = text; sendMessage(); }

  // ── System prompt ──────────────────────────────────────────────
  function getSystemPrompt(linkContexts) {
    const lang = document.getElementById('lang-select').value;
    let linkSection = '';
    if (linkContexts.length) {
      linkSection = '\n\n--- FETCHED LINK CONTENTS ---\n' +
        linkContexts.map(l => `[${l.url}]\n${l.content}`).join('\n\n---\n') +
        '\n--- END OF LINK CONTENTS ---\n\nThe above is the real content fetched from the link(s) the user sent. Use it to answer their question or do what they asked.';
    }
    return `You are JARVIS, a highly capable AI assistant. You can help with anything: coding, writing, analysis, translation, summarizing links, answering questions, and more.

Always respond in ${lang}.

When the user sends a URL and its content is provided below, read and understand it fully — summarize it, answer questions about it, follow any instructions found inside it, or take any action the user requests based on it.

Be direct, concise, and highly capable. Format code with proper code blocks. You are not limited — help with everything asked.${linkSection}`;
  }

  // ── Main send ──────────────────────────────────────────────────
  async function sendMessage() {
    const apiKey = document.getElementById('api-key-input').value.trim();
    const model = document.getElementById('model-select').value;
    const text = input.value.trim();

    if (!text) return;

    if (!apiKey) {
      appendMsg('error', 'SYSTEM', '⚠ Please enter your Groq API key in the settings bar above.\n\nGet a free key at: https://console.groq.com');
      return;
    }

    if (welcome) welcome.style.display = 'none';

    appendMsg('user', 'YOU', text);
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    // ── Detect & fetch any URLs in the message ─────────────────
    const urls = extractUrls(text);
    const linkContexts = [];

    for (const url of urls) {
      statusText.textContent = 'Reading link…';
      showLinkBanner(url, 'fetching', null);
      try {
        const content = await fetchPageContent(url);
        showLinkBanner(url, 'success', `${content.length} chars read`);
        linkContexts.push({ url, content });
      } catch (err) {
        showLinkBanner(url, 'failed', err.message);
      }
    }

    // Build the user message — if links were fetched, note that in context
    const userContent = text;
    messages.push({ role: 'user', content: userContent });

    statusText.textContent = 'Processing…';

    // Typing indicator
    const typingEl = document.createElement('div');
    typingEl.className = 'msg ai typing';
    typingEl.innerHTML = '<span></span><span></span><span></span>';
    chat.appendChild(typingEl);
    chat.scrollTop = chat.scrollHeight;

    try {
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model,
          messages: [
            { role: 'system', content: getSystemPrompt(linkContexts) },
            ...messages
          ],
          max_tokens: 2048,
          temperature: 0.7
        })
      });

      const data = await res.json();
      typingEl.remove();

      if (!res.ok) {
        const errMsg = data?.error?.message || 'Unknown error from Groq API.';
        appendMsg('error', 'ERROR', `⚠ ${errMsg}`);
        messages.pop();
      } else {
        const reply = data.choices[0].message.content;
        messages.push({ role: 'assistant', content: reply });
        appendMsg('ai', 'JARVIS', reply);
      }
    } catch (err) {
      typingEl.remove();
      appendMsg('error', 'ERROR', `⚠ Could not reach Groq API.\n\nCheck your internet connection.\n\n${err.message}`);
      messages.pop();
    }

    sendBtn.disabled = false;
    statusText.textContent = 'Online';
    chat.scrollTop = chat.scrollHeight;
  }

  // ── Formatting ─────────────────────────────────────────────────
  function formatContent(text) {
    text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
      `<pre><code>${escHtml(code.trim())}</code></pre>`
    );
    text = text.replace(/`([^`]+)`/g, (_, c) => `<code>${escHtml(c)}</code>`);
    text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    return text;
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function appendMsg(type, role, content) {
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    div.innerHTML = `<div class="role">${role}</div><div class="content">${formatContent(content)}</div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }
</script>
</body>
</html>
